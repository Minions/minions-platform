name: Preview Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Compute what the next stable version would be (without pushing that tag),
  # derive a pre-release tag from it (e.g. v0.2.0-pre), burn any existing
  # preview releases, and push the new preview tag.
  version:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.preview-tag.outputs.tag }}
      changelog: ${{ steps.tag.outputs.changelog }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Delete all existing preview releases (and their tags) BEFORE computing
      # the next version — so the bump action sees only the last stable tag.
      - name: Delete existing preview releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName \
            --jq '.[] | select(.tagName | endswith("-pre")) | .tagName' \
          | while read -r tag; do
              gh release delete "$tag" --yes --cleanup-tag || true
            done

      # Dry-run: compute the next version without pushing any tag.
      # Preview releases were deleted above, so the bump naturally starts from
      # the last stable tag.
      - name: Compute next version (dry run)
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          dry_run: true

      # Append -pre to get a semver pre-release tag that sorts before the
      # stable release it previews (e.g. v0.2.0-pre < v0.2.0).
      - name: Create and push preview tag
        id: preview-tag
        run: |
          TAG="${{ steps.tag.outputs.new_tag }}-pre"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Remove stale tag from a failed previous run (no release → not caught above).
          git push origin --delete "$TAG" 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

  pipeline:
    needs: version
    uses: ./.github/workflows/_release-pipeline.yml
    with:
      tag: ${{ needs.version.outputs.new_tag }}
      changelog: ${{ needs.version.outputs.changelog }}
      prerelease: true
    secrets: inherit
